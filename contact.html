<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Contact — Jagmohan Sharma</title>
  <meta name="description" content="Get in touch with Dr Jagmohan Sharma.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta property="og:title" content="Contact — Jagmohan Sharma">
  <meta property="og:description" content="Get in touch with Dr Jagmohan Sharma.">
  <meta property="og:type" content="profile">
  <meta property="og:image" content="/assets/portrait.jpg">
  <link rel="canonical" href="https://www.jsharmaifs.in/contact">
  <link rel="stylesheet" href="https://facet.tanishksharma.com/lib/facet.css">
  <link rel="stylesheet" href="/styles.css">
  <script src="https://facet.tanishksharma.com/lib/facet.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <nav class="tab-bar tab-bar-top" aria-label="Sections">
    <div class="tab-set">
      <a class="tab-brand" href="/" aria-current="false">Jagmohan Sharma</a>
      <a class="tab-seg" href="/" aria-current="false">Writing</a>
      <a class="tab-seg" href="/career" aria-current="false">Career</a>
      <a class="tab-seg" href="/contact" aria-current="page">Contact</a>
    </div>
  </nav>

  <main id="main" class="container-narrow stack-loose page-under-bar">

    <section class="stack">
      <h1 class="heading-bar">Contact</h1>
      <form class="stack" id="contact-form">
        <label class="field">
          <span class="field-label">Name</span>
          <input type="text" name="name" required autocomplete="name">
        </label>
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" required autocomplete="email">
        </label>
        <label class="field">
          <span class="field-label">Message</span>
          <textarea name="message" rows="6" required></textarea>
        </label>
        <div class="row">
          <button class="btn btn-primary" type="submit" data-event="contact-send">Send</button>
        </div>
        <p class="field-msg" id="contact-msg" role="status" aria-live="polite"></p>
      </form>
    </section>

  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <span class="footer-wordmark">Jagmohan Sharma</span>
          <p class="footer-tagline">Forests, climate and conservation.</p>
        </div>
      </div>
      <div class="footer-bottom">
        <span>Indian Forest Service, 1990</span>
      </div>
    </div>
  </footer>

  <script>
    // No backend yet: the form hands off to the reader's mail client.
    const CONTACT_EMAIL = 'PLACEHOLDER@example.com';
    document.getElementById('contact-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const f = e.currentTarget;
      const name = f.elements.name.value.trim();
      const body = `${f.elements.message.value.trim()}\n\n${name}\n${f.elements.email.value.trim()}`;
      window.location.href = `mailto:${CONTACT_EMAIL}`
        + `?subject=${encodeURIComponent('Website enquiry from ' + name)}`
        + `&body=${encodeURIComponent(body)}`;
      document.getElementById('contact-msg').textContent = 'Opening your mail app.';
    });
  </script>
</body>
</html>
